version: '3.9'

services:
  # ----------------------------------------------------------------------------
  # Banco de Dados Relacional (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: voto-consciente-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: votoconsciente
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d votoconsciente"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voto-consciente-net

  # ----------------------------------------------------------------------------
  # API Backend (Spring Boot + Java 21 + Google Gemini RAG)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voto-consciente-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres-db:5432/votoconsciente
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - voto-consciente-net

volumes:
  postgres_data:
    driver: local

networks:
  voto-consciente-net:
    driver: bridge
