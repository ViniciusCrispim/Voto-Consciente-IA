spring:
  application:
    name: voto-consciente

  # Banco de dados (H2 para desenvolvimento)
  datasource:
    url: jdbc:h2:mem:votoconsciente;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60m

# APIs externas
apis:
  camara:
    base-url: https://dadosabertos.camara.leg.br/api/v2
    timeout-seconds: 30
    max-retries: 3
  tse:
    base-url: https://divulgacandcontas.tse.jus.br/divulga
    timeout-seconds: 30
  senado:
    base-url: https://legis.senado.leg.br/dadosabertos
    timeout-seconds: 30
  transparencia:
    base-url: https://api.portaldatransparencia.gov.br
    timeout-seconds: 30
    api-key: ${TRANSPARENCIA_API_KEY:}

# Inteligência Artificial (Google Gemini)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  timeout-seconds: 45

# Sincronização (TTL em horas)
sync:
  ttl-horas: 24
  legislatura-atual: 57

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha

# Logging
logging:
  level:
    br.com.votoconsciente: DEBUG
    org.springframework.web.reactive.function.client: WARN
