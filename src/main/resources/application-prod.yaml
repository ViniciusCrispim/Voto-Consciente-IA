spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/votoconsciente}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Em produção, Caffeine só para cache de curta duração
spring.cache.caffeine.spec: maximumSize=1000,expireAfterWrite=30m
